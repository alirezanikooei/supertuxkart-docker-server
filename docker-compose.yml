services:
  supertuxkart:
    image: ${STK_IMAGE:-ghcr.io/alirezanikooei/supertuxkart-docker-server:latest}
    network_mode: host
    volumes:
      - ${STK_DATA_VOLUME:-stk-data}:/home/stkserver/.config/supertuxkart/config-0.10
    environment:
      AI_KARTS: "${AI_KARTS:-0}"
      GAME_MODE: "${GAME_MODE:-}"
    restart: unless-stopped

volumes:
  stk-data:
