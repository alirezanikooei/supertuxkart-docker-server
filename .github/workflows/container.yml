name: Build and publish container

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --pull --tag stk-server:ci \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .

      - name: Check LAN discovery
        run: |
          container=$(docker run --detach --publish 127.0.0.1::2757/udp stk-server:ci)
          cleanup() {
            docker logs "$container"
            docker rm --force "$container" >/dev/null
          }
          trap cleanup EXIT
          address=$(docker port "$container" 2757/udp)
          python3 - "$address" <<'PY'
          import socket
          import sys
          import time
          import xml.etree.ElementTree as ET

          host, port = sys.argv[1].rsplit(":", 1)
          config = ET.parse("server_config.example.xml").getroot()
          expected_name = config.find("server-name").attrib["value"].encode()
          expected_port = int(config.find("server-port").attrib["value"])
          request = b"stk-server"
          packet = bytes([len(request)]) + request
          deadline = time.monotonic() + 60
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as client:
              client.connect((host, int(port)))
              client.settimeout(1)
              while time.monotonic() < deadline:
                  try:
                      client.send(packet)
                      response = client.recv(4096)
                  except (TimeoutError, ConnectionRefusedError):
                      time.sleep(0.25)
                      continue
                  if len(response) < 5:
                      continue
                  # The name follows a 32-bit version and a one-byte length.
                  end = 5 + response[4]
                  name = response[5:end]
                  # Two player counts precede the advertised gameplay port.
                  game_port = int.from_bytes(response[end + 2:end + 4], "big")
                  if name == expected_name and game_port == expected_port:
                      break
              else:
                  sys.exit("No discovery response from the SuperTuxKart server")
          PY

      - name: Push image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag stk-server:ci "$image:sha-$GITHUB_SHA"
          docker tag stk-server:ci "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
